# Standalone pnpm project (no sub-packages) — this file carries pnpm settings.
#
# allowBuilds: unrs-resolver (napi binary used by eslint-config-expo's
# import resolver) ships platform prebuilds as optionalDependencies; its
# postinstall is only a download fallback, so we deny the arbitrary build
# script (supply-chain conservative). Set to true if a platform without a
# prebuild ever needs the fallback.
#
# minimumReleaseAgeExclude: pnpm's supply-chain release-age gate blocks
# very fresh packages; the Expo SDK 57 set moves in lockstep, so these
# exact versions are excluded rather than disabling the gate globally.
allowBuilds:
  unrs-resolver: false
# expo-router's optional DOM peers must use the same React version as SDK 57.
# Otherwise automatic peer resolution can install a newer, incompatible renderer.
#
# Security overrides (#1769). Each is scoped to one parent and documented in
# audits/2026-10-31-mobile-app-npm-advisories.md; drop an entry once its
# parent ships a patched range.
# - '-' removes the stale optional peer @react-native-community/cli@12.1.1
#   (an RN 0.73-era CLI the lockfile had carried since before SDK 57). Expo
#   apps build and serve through @expo/cli, never this CLI; it was the only
#   source of the critical shell-quote finding (via cli-tools) and of the
#   ip, joi and fast-xml-parser findings.
# - glob 14 / minimatch 11 fix GHSA-3g3m-2fjr-6pw4 / GHSA-g3hv-75wg-m249 in
#   the Expo CLI/config/prebuild/fingerprint tooling and in typescript-eslint.
# - uuid 11 fixes GHSA-w5hq-g745-h8pq in xcode (prebuild; only calls v4()).
overrides:
  react-dom: 19.2.3
  '@react-native/community-cli-plugin>@react-native-community/cli': '-'
  '@expo/cli>glob': 14.0.3
  '@expo/config>glob': 14.0.3
  '@expo/config-plugins>glob': 14.0.3
  '@expo/fingerprint>glob': 14.0.3
  '@expo/metro-config>glob': 14.0.3
  '@expo/fingerprint>minimatch': 11.0.3
  '@typescript-eslint/typescript-estree>minimatch': 11.0.3
  xcode>uuid: 11.1.1
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.14'
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/prebuild-config@57.0.11'
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-server@57.0.2
  - expo@57.0.12
  - '@expo/metro-runtime@57.0.9'
  - '@expo/ui@57.0.10'
  - expo-router@57.0.12
  - jest-expo@57.0.4
