[package]
name = "libcrux-eval"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Dev-only evaluation harness: libcrux ML-KEM-768 / ML-DSA-65 vs RustCrypto ml-kem / ml-dsa (issue #1715). NOT part of the node workspace."

# Standalone workspace: keeps libcrux out of the node's dependency graph and
# out of the root Cargo.lock. The root workspace does not list this crate.
[workspace]

[dependencies]
# Candidate (Cryspen libcrux, hax/F*-verified in part -- see the decision memo).
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }
# `acvp` exposes sign_internal/verify_internal so the ACVP "internal" vectors can run.
libcrux-ml-dsa = { version = "=0.0.11", default-features = false, features = ["mldsa65", "acvp"] }
libcrux-platform = "=0.0.4"

# Incumbent, pinned to exactly what the root Cargo.lock resolves today.
ml-kem = { version = "=0.2.3", features = ["deterministic"] }
ml-dsa = "=0.1.1"
hybrid-array = "0.4"

# Botho's own facade, so the Botho-specific derivations (ChaCha20-seeded ML-KEM
# keygen, deterministic empty-context ML-DSA signing) are exercised exactly.
bth-crypto-pq = { path = "../../../crypto/pq" }
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }

serde_json = "1"
hex = "0.4"

[profile.release]
debug = false
