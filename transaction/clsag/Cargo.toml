[package]
name = "bth-transaction-clsag"
version = "0.3.0"
authors = ["Botho"]
edition = "2021"
description = "Self-contained CLSAG ring-signature transaction types for Botho (stealth addresses + ring signatures)"
license = "GPL-3.0"
rust-version = { workspace = true }

[lib]
name = "bth_transaction_clsag"
path = "src/lib.rs"

[features]
default = []
pq = ["bth-account-keys/pq", "dep:bth-crypto-pq"]
# Exposes test-only constructors (e.g. `Transaction::new_stub_with_fee`) to
# downstream crates' test/dev builds. Enabled by `botho` as a dev-dependency
# feature so its tests can build stub transactions across the crate boundary.
test-utils = []

[dependencies]
# Crypto & encoding
aes = { workspace = true }
ctr = { workspace = true }
hkdf = { workspace = true }
sha2 = { version = "0.10" }
rand_core = { workspace = true }
serde = { version = "1", features = ["derive"] }

# Botho crypto / key primitives (all wasm-compatible)
bth-account-keys = { path = "../../account-keys" }
bth-crypto-keys = { path = "../../crypto/keys" }
bth-crypto-pq = { path = "../../crypto/pq", optional = true }
bth-crypto-ring-signature = { path = "../../crypto/ring-signature" }
bth-transaction-types = { path = "../types", default-features = true }
bth-util-from-random = { path = "../../util/from-random" }

# On wasm32, the `getrandom` crate (used by `bth_util_from_random::OsRng`)
# requires the `wasm_js` feature (paired with the `getrandom_backend="wasm_js"`
# cfg in the workspace `.cargo/config.toml`) to bind to the browser's
# crypto.getRandomValues(). Enable it for wasm builds so the CLSAG signing path
# (which uses OsRng for ephemeral keys and signature nonces) works in the
# browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
rand = { workspace = true, features = ["thread_rng"] }
serde_json = "1"
