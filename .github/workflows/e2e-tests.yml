name: E2E Integration Tests

# Execution policy and measured boundaries: docs/consensus-regression-tests.md

on:
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain*'
      - '.github/workflows/e2e-tests.yml'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - regression
          - timing
          - chaos
          - load
          - byzantine
      include_ignored:
        description: 'Include ignored (long-running) tests'
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce parallelism to avoid resource contention
  RUST_TEST_THREADS: 1

jobs:
  regression-tests:
    name: Consensus regression tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'regression'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-03

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: consensus-regression-linux

      - name: Compile consensus regression targets
        timeout-minutes: 30
        run: |
          cargo test --locked -p botho --no-run \
            --test consensus_cluster_convergence \
            --test e2e_transfer_patterns \
            --test chaos_tests \
            --test load_tests

      # Ordinary execution includes both baseline tests. The eight ignored
      # chaos/load cases remain explicitly opt-in in their manual jobs below.
      - name: Execute consensus regression assertions
        timeout-minutes: 15
        run: |
          cargo test --locked -p botho \
            --test consensus_cluster_convergence \
            --test e2e_transfer_patterns \
            --test chaos_tests \
            --test load_tests \
            -- --test-threads=1

  timing-tests:
    name: Timing Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'timing'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-03
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Run timing tests
        run: |
          cargo test --locked --package botho --test timing_tests -- --test-threads=1

  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    if: >-
      (github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'chaos') &&
      github.event.inputs.include_ignored == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-03

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Run chaos tests
        run: |
          cargo test --locked --package botho --test chaos_tests -- --test-threads=1 --ignored

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    if: >-
      (github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'load') &&
      github.event.inputs.include_ignored == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-03

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Run load tests
        run: |
          cargo test --locked --package botho --test load_tests -- --test-threads=1 --ignored
        env:
          # Extended stack for load tests
          RUST_MIN_STACK: 8388608

  byzantine-tests:
    name: Byzantine Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'byzantine'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-03

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Run byzantine tests
        run: |
          cargo test --locked --package botho --test byzantine_integration -- --test-threads=1

  consensus-integration:
    name: Consensus Integration Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.test_suite == 'all'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-03

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Run consensus integration tests
        run: |
          cargo test --locked --package botho --test e2e_consensus_integration -- --test-threads=1
          cargo test --locked --package botho --test network_integration -- --test-threads=1
          # Progressive-fee curve suite (#669): fast and deterministic, but it
          # was in no workflow, so the #626/#627 curve recalibration silently
          # stranded its expectations. Runs here so fee-curve changes must
          # keep the e2e expectations current.
          cargo test --locked --package botho --test e2e_progressive_fees -- --test-threads=1

  summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: [regression-tests, timing-tests, chaos-tests, load-tests, byzantine-tests, consensus-integration]
    if: always()
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## E2E Test Results"
            echo ""
            echo "| Test Suite | Status |"
            echo "|------------|--------|"
            echo "| Consensus Regression | ${{ needs.regression-tests.result }} |"
            echo "| Timing Tests | ${{ needs.timing-tests.result }} |"
            echo "| Chaos Tests | ${{ needs.chaos-tests.result }} |"
            echo "| Load Tests | ${{ needs.load-tests.result }} |"
            echo "| Byzantine Tests | ${{ needs.byzantine-tests.result }} |"
            echo "| Consensus Integration | ${{ needs.consensus-integration.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # A printable summary must not turn failed/cancelled test jobs green.
          # Skipped manual selectors are intentional on PR/scheduled runs.
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
