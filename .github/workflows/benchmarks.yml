name: Benchmarks

on:
  # Run on PRs to check for regressions
  pull_request:
    paths:
      - 'crypto/**'
      - 'botho/src/**'
      - 'transaction/**'
      - '**/benches/**'
      - '.github/workflows/benchmarks.yml'
      - 'scripts/benchmarks/**'
  # Manual trigger for full benchmark runs
  workflow_dispatch:
    inputs:
      full_run:
        description: 'Run full benchmarks (not quick mode)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  compile-benchmarks:
    name: Compile Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      # Compile only the crates that actually have benchmark targets, instead
      # of `--workspace`. The full-workspace compile dragged in the Tauri
      # desktop crate (needs GTK/glib system libs) and a no_std-leaning member
      # that triggered a `k256` feature-unification break
      # ("`precomputed-tables` feature requires either `critical-section` or
      # `std`"). Neither crate has benchmarks, so scoping to the benched crates
      # keeps full benchmark coverage while sidestepping both failures and
      # removing the need for the GTK/glib apt install.
      - name: Check evidence collector
        run: python3 -m unittest discover -s scripts/benchmarks -v

      - name: Compile benchmarks (bench-bearing crates)
        run: >
          cargo bench --no-run
          -p botho
          -p bth-transaction-core
          -p bth-crypto-pq
          -p bth-crypto-ring-signature
          -p bth-account-keys
          -p bth-cluster-tax

  run-crypto-benchmarks:
    name: Crypto Benchmarks
    runs-on: ubuntu-latest
    needs: compile-benchmarks
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Remove restored Criterion reports
        id: clear_reports
        run: rm -rf -- target/criterion

      - name: Run MLSAG and CLSAG benchmarks (quick)
        id: mlsag_quick
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.full_run != 'true' }}
        run: cargo bench -p bth-crypto-ring-signature --bench ring_signature_benchmarks -- --quick --noplot
        continue-on-error: true

      - name: Run MLSAG and CLSAG benchmarks (full)
        id: mlsag_full
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true' }}
        run: cargo bench -p bth-crypto-ring-signature --bench ring_signature_benchmarks -- --noplot

      - name: Collect benchmark evidence
        if: always()
        env:
          BENCH_OUTCOMES: '{"clear_reports":"${{ steps.clear_reports.outcome }}","mlsag_quick":"${{ steps.mlsag_quick.outcome }}","mlsag_full":"${{ steps.mlsag_full.outcome }}"}'
          BENCH_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BENCH_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true' && 'full' || 'quick' }}
        run: python3 scripts/benchmarks/evidence.py

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-evidence/manifest.json
            target/criterion/
          retention-days: 14
          if-no-files-found: warn

  run-node-benchmarks:
    name: Node Benchmarks
    runs-on: ubuntu-latest
    needs: compile-benchmarks
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Remove restored Criterion reports
        id: clear_reports
        run: rm -rf -- target/criterion

      - name: Run block benchmarks (quick)
        id: block_quick
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.full_run != 'true' }}
        run: cargo bench -p botho --bench block_benchmarks -- --quick --noplot
        continue-on-error: true

      - name: Run mempool benchmarks (quick)
        id: mempool_quick
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.full_run != 'true' }}
        run: cargo bench -p botho --bench mempool_benchmarks -- --quick --noplot
        continue-on-error: true

      - name: Run traffic normalization benchmarks (quick)
        id: traffic_quick
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.full_run != 'true' }}
        run: cargo bench -p botho --bench traffic_normalization -- --quick --noplot
        continue-on-error: true

      - name: Run block benchmarks (full)
        id: block_full
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true' }}
        run: cargo bench -p botho --bench block_benchmarks -- --noplot

      - name: Run mempool benchmarks (full)
        id: mempool_full
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true' }}
        run: cargo bench -p botho --bench mempool_benchmarks -- --noplot

      - name: Run traffic normalization benchmarks (full)
        id: traffic_full
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true' }}
        run: cargo bench -p botho --bench traffic_normalization -- --noplot

      - name: Collect benchmark evidence
        if: always()
        env:
          BENCH_OUTCOMES: '{"clear_reports":"${{ steps.clear_reports.outcome }}","block_quick":"${{ steps.block_quick.outcome }}","mempool_quick":"${{ steps.mempool_quick.outcome }}","traffic_quick":"${{ steps.traffic_quick.outcome }}","block_full":"${{ steps.block_full.outcome }}","mempool_full":"${{ steps.mempool_full.outcome }}","traffic_full":"${{ steps.traffic_full.outcome }}"}'
          BENCH_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BENCH_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true' && 'full' || 'quick' }}
        run: python3 scripts/benchmarks/evidence.py

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-evidence/manifest.json
            target/criterion/
          retention-days: 14
          if-no-files-found: warn

  run-transaction-benchmarks:
    name: Transaction Benchmarks
    runs-on: ubuntu-latest
    needs: compile-benchmarks
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Remove restored Criterion reports
        id: clear_reports
        run: rm -rf -- target/criterion

      - name: Run transaction benchmarks (quick)
        id: transaction_quick
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.full_run != 'true' }}
        run: cargo bench -p bth-transaction-core --bench transaction_benchmarks -- --quick --noplot
        continue-on-error: true

      - name: Run transaction benchmarks (full)
        id: transaction_full
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true' }}
        run: cargo bench -p bth-transaction-core --bench transaction_benchmarks -- --noplot

      - name: Collect benchmark evidence
        if: always()
        env:
          BENCH_OUTCOMES: '{"clear_reports":"${{ steps.clear_reports.outcome }}","transaction_quick":"${{ steps.transaction_quick.outcome }}","transaction_full":"${{ steps.transaction_full.outcome }}"}'
          BENCH_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BENCH_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true' && 'full' || 'quick' }}
        run: python3 scripts/benchmarks/evidence.py

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-evidence/manifest.json
            target/criterion/
          retention-days: 14
          if-no-files-found: warn

  summary:
    name: Benchmark Summary
    runs-on: ubuntu-latest
    needs: [compile-benchmarks, run-crypto-benchmarks, run-node-benchmarks, run-transaction-benchmarks]
    if: always()
    steps:
      - name: Generate summary
        run: |
          {
          echo "## Benchmark Results"
          echo ""
          echo "| Benchmark Suite | Status |"
          echo "|-----------------|--------|"
          echo "| Compile | ${{ needs.compile-benchmarks.result }} |"
          echo "| Crypto (MLSAG + CLSAG) | ${{ needs.run-crypto-benchmarks.result }} |"
          echo "| Node (Block/Mempool/Traffic) | ${{ needs.run-node-benchmarks.result }} |"
          echo "| Transaction | ${{ needs.run-transaction-benchmarks.result }} |"
          echo ""
          echo "### Performance Targets"
          echo ""
          echo "#### Cryptography coverage"
          echo "- Actual suites: MLSAG 11/16/32; valid CLSAG library 2/20/32 (20 is current default)."
          echo "- Job success is not benchmark success: inspect raw step outcomes and Criterion artifacts."
          echo "- Compile-only jobs have no timing evidence. Canceled jobs may leave no artifact."
          echo ""
          echo "#### Traffic Normalization (Phase 2)"
          echo "- Standard: <200ms p99 latency, <50% bandwidth overhead"
          echo "- Maximum: <1s p99 latency, <2x bandwidth overhead"
          echo "- CPU overhead: <5% (standard), <10% (maximum)"
          echo "- Memory overhead: <10MB (standard), <50MB (maximum)"
          echo ""
          echo "> **Note**: Benchmarks run in quick mode on PRs. Use workflow_dispatch with full_run=true for detailed results."

          } >> "$GITHUB_STEP_SUMMARY"
