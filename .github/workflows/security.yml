name: Security

# Runs cargo-deny as a supply-chain gate: advisories, licenses, bans, sources.
#
# Trigger note: unlike workspace-build.yml (which path-filters to `**.rs` etc.),
# this job runs on EVERY pull request and every push to main. A security
# advisory gate must not be path-filtered: RustSec advisories are published
# continuously and can newly apply to dependencies that a given PR never
# touches, so gating only on Rust/manifest changes would let the tree drift
# out of compliance between dependency edits. `workflow_dispatch` is kept for
# manual runs. cargo-deny only reads local files, so `contents: read` is
# sufficient and no secrets are required.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lru-panic-safety:
    name: Vendored LRU panic safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/lru-panic-safety
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Upstream tests and panic-safety regression
        run: |
          cargo test --manifest-path vendor/lru/Cargo.toml --locked
          cargo test --manifest-path vendor/lru/Cargo.toml --locked --no-default-features
      - name: Install Miri
        run: rustup toolchain install nightly-2026-10-23 --profile minimal --component miri
      - name: Verify the regression under Miri
        run: |
          cargo +nightly-2026-10-23 miri test --manifest-path vendor/lru/Cargo.toml --locked --test pop_panic_safety
          cargo +nightly-2026-10-23 miri test --manifest-path vendor/lru/Cargo.toml --locked --test pop_panic_safety --no-default-features

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
