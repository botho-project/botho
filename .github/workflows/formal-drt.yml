l/Botho/Lottery/Pool.lean': 'eec548f77ae263473f8b97951f1a127e7a71d20f3d60268d09504bdecf05552e', 'formal/Botho/Lottery/Prims.lean': '3602594b269c85bf7190bb813e87a0853bec87125df753048e55277bd93db2b7', 'formal/Botho/Lottery/Seed.lean': '7d3c26a9123a9b4e4229221b51225fdb0f9cb4bd920744ae82cce73e084ff2ee', 'formal/Botho/Lottery/SeedIndependence.lean': '104549af85e29fbffc9abc58e153919158bae295bd4b8144bb517a05055d208d', 'formal/Botho/Lottery/Sybil.lean': 'dadf9f84d78c84f3eeceb4c24e3919c31c159d2e9d762709eb8e45bfe413a954', 'formal/Botho/Lottery/SybilExpectation.lean': '5271b3f5ba6a572e47733f2bcafc222a45b23f9387cc933adef81556d126b0df', 'formal/Botho/Lottery/Window.lean': '8369a51dc4557500b2bbf131de86c0c7d866ce568c54a4cff8d2736b45daaa42', 'formal/Botho/Monetary/Emission.lean': '1f8f6060729e4065e9838c0f166670f1d7cc93a8091065cbfd3716456cdae37a', 'formal/Botho/Quorum/Fbas.lean': 'a7139033b93f7590dab01566d2ffc6a7b3542167115d397d7c4c1275d7ce39a2', 'formal/Botho/Supply/Accounting.lean': 'fe455e20d1c7ef240a614d3e771129a2461d147f41affeeb2b8bad31e8277804', 'formal/Botho/Supply/Block.lean': 'bc4eaeec1566ced51c35ce486bd835c27b2bd68e397d1c6e43cfa3163775020e', 'formal/Botho/Supply/Transactions.lean': 'aea12fd8f6e05ac41f0803d4126c5bf75f7501ef05eb630a1d08ada9d1c24f82', 'formal/Botho/Tags/EffectiveExact.lean': '2301db5779bdaa1e1e6919f48c072aaa227546d3db999e6f8d61265beacd81f8', 'formal/Botho/Tags/Inherit.lean': 'ed4832f2b729b41c8fb701f6ddff628dcec6e70dcc52eb076e7eaaaf92ef8d79', 'formal/Botho/Tags/Vector.lean': '1008e3f5c43f9f1505dd995e30f5ddf3915cb2d8fa422bf7f93c8c5f7227ecfa', 'formal/Botho/Timestamps.lean': '7ee0da97051214675363a43bfbb5e6a8d8ac499f114fe065cd44483f4f8df8a4', 'formal/Theorems.lean': '067091e7f60bde9156d9b8ddfc4760acc110ae9a0cfbf17c87ed32cb59abb121', 'formal/axioms-allowlist.txt': 'ab98ab147157e5e66abfc784fbaf92b42ad0d7cb7681ab40776519a0c1619579', 'formal/statements.txt': 'bb4ad56820cb380c2343cb1f9df9b7cf272ff8b5959f1dc18a212f54d46ea7c6'}

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          receipt = dict(normal_head=NORMAL_HEAD, normal_tree=NORMAL_TREE,
                         checkout_head=git('rev-parse', 'HEAD'), checkout_tree=git('rev-parse', 'HEAD^{tree}'),
                         workflow_head=os.environ['GITHUB_SHA'], workflow_ref=os.environ['GITHUB_REF'],
                         mode=os.environ['QUANTILE_MODE'], run_id=os.environ['GITHUB_RUN_ID'],
                         commands=[], controls={}, all_commands_settled=False, status='running')

          def save():
              (OUT / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')

          def run(name, args, expected=0, cap=180, cwd=DRT):
              log = OUT / (name + '.log')
              start = time.monotonic()
              with log.open('wb') as stream:
                  process = subprocess.Popen(args, cwd=cwd, stdout=stream, stderr=subprocess.STDOUT,
                                             start_new_session=True)
                  try:
                      code = process.wait(timeout=cap)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
                      code = 124
              command = dict(name=name, args=list(map(str, args)), cwd=str(cwd), cap_seconds=cap,
                             expected_exit=expected, exit=code, seconds=time.monotonic()-start,
                             log=log.name, log_sha256=sha(log))
              receipt['commands'].append(command)
              save()
              assert code == expected, command
              return log

          def report(name, directory, cases, expected):
              path = OUT / (name + '.json')
              run(name, [str(RUNNER), '--legs', 'ring_elapsed_quantile', '--cases', str(cases),
                         '--seed', '1993', '--regressions', str(directory), '--json', str(path)],
                  expected=expected)
              data = json.loads(path.read_text())
              assert len(data['legs']) == 1
              leg = data['legs'][0]
              assert leg['leg'] == 'ring_elapsed_quantile'
              return leg, sha(path)

          def semantic(leg):
              assert leg['mismatches'], 'expected numerical mismatches'
              for mismatch in leg['mismatches']:
                  assert all(isinstance(mismatch[s], str) and mismatch[s].isdecimal() for s in ['rust','lean']), mismatch
                  assert mismatch['rust'] != mismatch['lean'], mismatch

          try:
              actual = {path: sha(ROOT / path) for path in EXPECTED_SOURCES}
              assert actual == EXPECTED_SOURCES
              receipt['source_hashes'] = actual
              receipt['normal_runner_sha256'] = sha(RUNNER)
              receipt['model_sha256'] = sha(MODEL)
              receipt['fixture_sha256'] = sha(VECTORS)
              receipt['root_lock_sha256'] = sha(ROOT/'Cargo.lock')
              receipt['resolved_lock_sha256'] = sha(DRT/'Cargo.lock')
              (OUT/'root-Cargo.lock').write_bytes((ROOT/'Cargo.lock').read_bytes())
              (OUT/'resolved-Cargo.lock').write_bytes((DRT/'Cargo.lock').read_bytes())
              (OUT/'source-original.rs').write_bytes(ORIGINAL)
              (OUT/'Age.lean').write_bytes((ROOT/'formal/Botho/Demurrage/Age.lean').read_bytes())
              (OUT/'control.py').write_bytes(Path(__file__).read_bytes())
              (OUT/'vectors.jsonl').write_bytes(VECTORS.read_bytes())
              run('toolchains', ['bash','-c','rustc --version && cargo --version && lean --version'],cwd=DRT/'lean')
              testlog = run('live-vectors', ['cargo','test','--release','quantile_live_rust_and_lean_vectors','--','--nocapture'], cap=300)
              assert testlog.read_text().count('quantile vector ') == 27
              assert 'vectors=27 transformations=114 implementations=2' in testlog.read_text()
              receipt['live_counts'] = dict(vectors=27,transformations=114,implementations=2)
              discovery = run('leg-discovery', [str(RUNNER),'--list']).read_text().splitlines()
              assert len(discovery) == len(set(discovery)) == 27 and 'ring_elapsed_quantile' in discovery
              receipt['discovered_legs'] = discovery
              run('nightly-helper-tests', ['python3','-m','unittest','discover','-s','formal-drt/scripts','-p','test_*.py','-v'],cwd=ROOT)

              if os.environ['QUANTILE_MODE'] == 'controls':
                  vectors = [json.loads(line) for line in VECTORS.read_text().splitlines()]
                  for kind, needle, replacement, note in [
                      ('floor', '    let rank = (q * n).div_ceil(10_000);', '    let rank = (q * n) / 10_000;', 'unsorted three q=3334'),
                      ('unsorted', '    ages.sort_unstable();', '    // CONTROL: sorting deliberately omitted.', 'unsorted three q=0'),
                  ]:
                      text = ORIGINAL.decode()
                      assert text.count(needle) == 1
                      mutated = text.replace(needle, replacement)
                      SOURCE.write_text(mutated)
                      patch = ''.join(difflib.unified_diff(text.splitlines(True),mutated.splitlines(True),fromfile='a/cluster-tax/src/demurrage.rs',tofile='b/cluster-tax/src/demurrage.rs'))
                      (OUT/(kind+'.patch')).write_text(patch)
                      control = dict(source_sha256=sha(SOURCE),patch_sha256=sha(OUT/(kind+'.patch')))
                      receipt['controls'][kind] = control
                      run(kind+'-build',['cargo','build','--release'],cap=900)
                      control['runner_sha256'] = sha(RUNNER)
                      assert sha(MODEL) == receipt['model_sha256']
                      target = OUT/(kind+'-target-fixtures')
                      target.mkdir()
                      vector = next(v for v in vectors if v['note'] == note)
                      (target/'ring_elapsed_quantile.jsonl').write_text(json.dumps(vector)+'\n')
                      leg,digest = report(kind+'-target',target,0,1)
                      semantic(leg)
                      assert leg['replayed'] == 1 and leg['cases'] == leg['compared'] == 0
                      assert leg['mismatches'][0]['lean'] == vector['expected']
                      assert leg['mismatches'][0]['rust'] == ('10' if kind == 'floor' else '30')
                      control['target_report_sha256'] = digest
                      if kind == 'floor':
                          directory = OUT/'generated-fixtures'
                          directory.mkdir()
                          assert not list(directory.iterdir())
                          leg,digest = report('floor-generated',directory,64,1)
                          semantic(leg)
                          assert leg['replayed'] == 0 and leg['compared'] > 0 and leg['shrink_attempts'] > 0
                          assert all('replayed_fixture' not in m for m in leg['mismatches'])
                          fixture = directory/'ring_elapsed_quantile.jsonl'
                          control['generated_counts'] = {k:leg[k] for k in ['cases','compared','shrink_attempts','replayed']}
                          control['generated_report_sha256'] = digest
                          control['saved_fixture_sha256'] = sha(fixture)
                          control['saved_fixtures'] = len(fixture.read_text().splitlines())
                          replay,digest = report('floor-generated-failing-replay',directory,0,1)
                          semantic(replay)
                          assert replay['replayed'] == control['saved_fixtures']
                          assert sha(fixture) == control['saved_fixture_sha256']
                          control['failing_replay_sha256'] = digest
                      SOURCE.write_bytes(ORIGINAL)
                      control['restored_source_sha256'] = sha(SOURCE)
                      assert sha(SOURCE) == EXPECTED_SOURCES['cluster-tax/src/demurrage.rs']
                      save()
                  run('restored-build',['cargo','build','--release'],cap=900)
                  receipt['restored_runner_sha256'] = sha(RUNNER)
                  for name in ['floor-target','unsorted-target','generated']:
                      directory = OUT/(name+'-fixtures')
                      fixture = directory/'ring_elapsed_quantile.jsonl'
                      before = sha(fixture)
                      clean,digest = report(name+'-restored-replay',directory,0,0)
                      assert not clean['mismatches'] and clean['replayed'] == len(fixture.read_text().splitlines())
                      assert sha(fixture) == before
                      receipt[name+'-restored'] = dict(report_sha256=digest,fixture_sha256=before,replayed=clean['replayed'])
              assert {path:sha(ROOT/path) for path in EXPECTED_SOURCES} == EXPECTED_SOURCES
              assert sha(MODEL) == receipt['model_sha256']
              assert sha(DRT/'Cargo.lock') == receipt['resolved_lock_sha256']
              run('final-clean-diff',['git','diff','--exit-code'],cwd=ROOT)
              receipt['status'] = 'success'
          except BaseException:
              receipt['status'] = 'failure'
              receipt['error'] = traceback.format_exc()
              raise
          finally:
              SOURCE.write_bytes(ORIGINAL)
              receipt['restored_source_sha256'] = sha(SOURCE)
              receipt['all_commands_settled'] = True
              save()
          PYCONTROL
          python3 "$RUNNER_TEMP/quantile-control.py"
      - name: Retain quantile provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quantile-provenance
          path: ${{ runner.temp }}/quantile-evidence/
          if-no-files-found: error
          retention-days: 14
      # The per-PR budget is 5 minutes for the run itself (it takes about a
      # minute on a GitHub runner); the build above is not counted.
      - name: DRT (per-PR tier)
        working-directory: formal-drt
        timeout-minutes: 5
        env:
          CASES: ${{ github.event.inputs.cases || '10000' }}
          SEED: ${{ github.event.inputs.seed || '1707' }}
        run: |
          target/release/botho-formal-drt --cases "$CASES" --seed "$SEED" \
            --json "$RUNNER_TEMP/drt-report.json"
      - name: Upload clean or failing DRT report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-drt-report
          path: ${{ runner.temp }}/drt-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload shrunk fixtures and report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formal-drt-mismatches
          path: |
            formal-drt/regressions/
            ${{ runner.temp }}/drt-report.json
          if-no-files-found: ignore
          retention-days: 14
