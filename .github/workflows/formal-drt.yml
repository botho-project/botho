name: Formal DRT (Lean model vs Rust)

# Differential random testing of the Lean LotteryV2 model (formal/Botho/
# Lottery/) against the Rust node and cluster-tax (#1706, #1707, epic #1704).
#
# Per-PR tier: fixed seed, 10,000 cases per leg, and the replay of every
# fixture in formal-drt/regressions/. A mismatch fails the job and uploads
# the shrunk case (appended to formal-drt/regressions/<leg>.jsonl) and the
# JSON report.
#
# This job is a test, not a gate on the proofs: it builds and runs model code
# (the Lean executable) and has no part in the formal-gate trust boundary
# (formal.yml). The model it runs is the gated formal/ package, required by
# path from formal-drt/lean/.
#
# The nightly tier is in formal-drt-nightly.yml. The cluster-tax simulation
# coverage includes bounded actual-entrypoint monetary vectors (#1922).

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'formal-drt/**'
      - 'cluster-tax/src/monetary.rs'
      - 'botho/src/monetary.rs'
      - 'cluster-tax/src/simulation/emission_sweep.rs'
      - 'cluster-tax/src/simulation/lottery.rs'
      - 'cluster-tax/src/simulation/lottery_production.rs'
      - 'cluster-tax/src/lottery.rs'
      - 'cluster-tax/src/demurrage.rs'
      - 'cluster-tax/src/fee_curve.rs'
      - 'botho/src/consensus/lottery.rs'
      - 'botho/src/ledger/lottery_v2.rs'
      - 'botho/src/ledger/formal_drt.rs'
      - 'botho/src/ledger/formal_drt_tags.rs'
      - 'botho/src/ledger/formal_drt_supply.rs'
      - 'botho/src/ledger/mod.rs'
      - 'botho/src/node/minter.rs'
      - 'botho/src/consensus/validation.rs'
      - 'transaction/types/src/cluster_tags.rs'
      - 'botho/src/ledger/store.rs'
      - 'botho/src/ledger/store/validation.rs'
      - 'botho/src/block.rs'
      - 'botho/src/pow.rs'
      - 'botho/src/consensus/service.rs'
      - 'botho/src/formal_drt_difficulty.rs'
      - 'botho/src/formal_drt_difficulty/**'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.github/workflows/formal-drt.yml'
      - '.github/workflows/formal-drt-nightly.yml'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'formal-drt/**'
      - 'cluster-tax/src/monetary.rs'
      - 'botho/src/monetary.rs'
      - 'cluster-tax/src/simulation/emission_sweep.rs'
      - 'cluster-tax/src/simulation/lottery.rs'
      - 'cluster-tax/src/simulation/lottery_production.rs'
      - 'cluster-tax/src/lottery.rs'
      - 'cluster-tax/src/demurrage.rs'
      - 'cluster-tax/src/fee_curve.rs'
      - 'botho/src/consensus/lottery.rs'
      - 'botho/src/ledger/lottery_v2.rs'
      - 'botho/src/ledger/formal_drt.rs'
      - 'botho/src/ledger/formal_drt_tags.rs'
      - 'botho/src/ledger/formal_drt_supply.rs'
      - 'botho/src/ledger/mod.rs'
      - 'botho/src/node/minter.rs'
      - 'botho/src/consensus/validation.rs'
      - 'transaction/types/src/cluster_tags.rs'
      - 'botho/src/ledger/store.rs'
      - 'botho/src/ledger/store/validation.rs'
      - 'botho/src/block.rs'
      - 'botho/src/pow.rs'
      - 'botho/src/consensus/service.rs'
      - 'botho/src/formal_drt_difficulty.rs'
      - 'botho/src/formal_drt_difficulty/**'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.github/workflows/formal-drt.yml'
      - '.github/workflows/formal-drt-nightly.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact normal source checkout for evidence'
        required: true
        default: '7eb426d8c7bcda232a5d8469e4dfd37d5b56a752'
      quantile_mode:
        description: 'controls or normal'
        required: true
        default: 'controls'
      cases:
        description: 'Cases per leg'
        required: false
        default: '10000'
      seed:
        description: 'Seed (a u64, or "random")'
        required: false
        default: '1707'

permissions:
  contents: read

concurrency:
  group: formal-drt-${{ github.ref }}
  cancel-in-progress: true

env:
  ELAN_VERSION: v4.2.4

jobs:
  nightly-helper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.source_ref }}
      - run: python3 -m unittest discover -s formal-drt/scripts -p 'test_*.py' -v

  drt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-09
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: formal-drt
          workspaces: formal-drt -> target
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ env.ELAN_VERSION }}-${{ hashFiles('formal/lean-toolchain') }}
      - name: Install elan
        run: |
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_VERSION}/elan-init.sh" -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none --no-modify-path
            rm elan-init.sh
          fi
          echo "$HOME/.elan/bin" >>"$GITHUB_PATH"
      - name: Build the Lean model executable
        working-directory: formal-drt/lean
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lake build
      # The DRT crate is its own workspace. Seeding its lockfile from the root
      # one makes it build the node's exact dependency versions.
      - name: Seed the lockfile from the root workspace
        run: cp Cargo.lock formal-drt/Cargo.lock
      - name: Format
        working-directory: formal-drt
        run: cargo +nightly-2026-06-09 fmt -- --check
      - name: Clippy (deny warnings)
        working-directory: formal-drt
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Unit tests
        working-directory: formal-drt
        timeout-minutes: 8
        env:
          SUPPLY_ORACLE_DIR: ${{ runner.temp }}/supply-oracle
        run: |
          set -o pipefail
          timeout 420s cargo test --release -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/supply-oracle-unit-tests.log"
      - name: Upload actual-commit oracle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-oracle-evidence
          path: |
            ${{ runner.temp }}/supply-oracle/
            ${{ runner.temp }}/supply-oracle-unit-tests.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Bounded monetary simulation vectors
        timeout-minutes: 5
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_TARGET_DIR: ${{ github.workspace }}/formal-drt/target
        run: cargo test --release -p bth-cluster-tax --lib monetary_drt_simulation_vectors -- --nocapture
      - name: Build the runner
        working-directory: formal-drt
        run: cargo build --release
      - name: Quantile numerical controls and provenance (temporary)
        timeout-minutes: 35
        env:
          QUANTILE_MODE: ${{ github.event.inputs.quantile_mode }}
        run: |
          cat > "$RUNNER_TEMP/quantile-control.py" <<'PYCONTROL'
          import difflib
          import hashlib
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import time
          import traceback

          ROOT = Path.cwd()
          OUT = Path(os.environ['RUNNER_TEMP']) / 'quantile-evidence'
          OUT.mkdir(exist_ok=True)
          SOURCE = ROOT / 'cluster-tax/src/demurrage.rs'
          ORIGINAL = SOURCE.read_bytes()
          DRT = ROOT / 'formal-drt'
          RUNNER = DRT / 'target/release/botho-formal-drt'
          MODEL = DRT / 'lean/.lake/build/bin/botho-model'
          VECTORS = DRT / 'regressions/ring_elapsed_quantile.jsonl'
          NORMAL_HEAD = '7eb426d8c7bcda232a5d8469e4dfd37d5b56a752'
          NORMAL_TREE = 'd1695f8756607a2a71af4568c0f8c2997e59ce83'
          EXPECTED_SOURCES = {'.github/workflows/formal-drt-nightly.yml': '7de68158c97f3deb1d1d7158842959c42f1b2cee6c92d16a496590038fc02343', '.github/workflows/formal.yml': 'd2c6900cfae90c9283e80bbe59cb176b3bee7ca965dd90524675db7e1e4b946a', 'Cargo.lock': '3048931612bd8132f8e5ce412e037de7c3569a86e13cd44dfd0d28093999accc', 'cluster-tax/src/demurrage.rs': '9d1bfeadc16192948529fbc8b5e3ada89d8991e9c0a825fc8e74b53f963fe4f0', 'cluster-tax/src/lib.rs': '7ce7a65667392b1b83b8f0c0cfb6f41a6e120e00a06b415c8aef5650b39261e1', 'formal-drt/.gitignore': '7731fb3ae2d0f9e108e8e176d5323abd998d6a165afa1a5800b475cfc0cfb57b', 'formal-drt/Cargo.toml': '6e5ccb7e6694a1936697e2f1d5b80e3b108e31108164c278b94dee9b9ed348cd', 'formal-drt/lean/Drt/Codec.lean': '1b25f61795cfab47bf2fe32bdaaf5fc5a36a4af7428b3c65109a098bfa8c7991', 'formal-drt/lean/Drt/Sha256.lean': '5768ec5bbe763b7040e3fe83915af1ef082d7d38faf4cc2257481c90f5830d75', 'formal-drt/lean/Drt/Tags.lean': '003dcb3fe3dced7a94a4f947c536a2a45b8a8ace55f3f37f47ccf353e5406d44', 'formal-drt/lean/Main.lean': '34b02c1ed26a955827a70ee9bd91056368f860e74a722e6b72d5a0ff9defd9fb', 'formal-drt/lean/lake-manifest.json': '7002af2aa0f7e02027a48bb10869ce097d1553c851c6512c5bffde956b1f414e', 'formal-drt/lean/lakefile.toml': '4e86c8a74a7255b4d4f5657a360912e9e5285e0c28bbe93aae08819430718ca8', 'formal-drt/lean/lean-toolchain': 'ca5f1f601d34c49079e38d7e7041eb0f2a9c227fbc1df0f404820069a052330c', 'formal-drt/nightly-validation.json': '4d57760ce072c53198251333239c892b4be3c5804e1502119078afd987ded2cc', 'formal-drt/regressions/README.md': '70dc7ad5538df56dfa5e68af55835eb4b788937ec930b291bb817e9ba97acc8d', 'formal-drt/regressions/cluster_tag_inheritance.jsonl': '17014773709a00661e95317af8340f91dba75abb8dd4dfb933271edea02c2237', 'formal-drt/regressions/compute_pool_accounting.jsonl': '0a949113c5f26e98bd522268e678a1a68b1d8240268b7741298f3b91733596e8', 'formal-drt/regressions/count_eligible.jsonl': '3de2ac3d406afba56b82496b142869cd24e434b2d16ab0693e699f4a1c681804', 'formal-drt