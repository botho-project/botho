name: Centroid retained diagnostic control (issue 1998)
on:
  workflow_dispatch:
    inputs:
      source:
        required: true
        default: '9f62edc722e33988965d2d063eee2a65624cddf6'
      mode:
        required: true
        default: 'old'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: evidence-driver
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-09
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: formal-drt
          workspaces: formal-drt -> target
      - name: Build canonical Lean and Rust runners
        if: inputs.mode != 'old'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd formal-drt/lean
          elan toolchain install "$(cat lean-toolchain)"
          lake build
          cd ..
          cp ../Cargo.lock Cargo.lock
          cargo fmt -- --check
          cargo clippy --release --all-targets -- -D warnings
          cargo build --release
      - name: Execute source-bound evidence driver
        env:
          CENTROID_MODE: ${{ inputs.mode }}
        run: python3 evidence-driver/.github/scripts/centroid-evidence.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: centroid-evidence
          path: ${{ runner.temp }}/centroid-evidence
          if-no-files-found: error
          retention-days: 30
