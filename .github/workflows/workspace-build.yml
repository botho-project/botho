name: Workspace Build

# Linux-only `cargo build --workspace` check. The full workspace includes the
# Tauri desktop crate, whose Linux-gated GUI subtree triggers a k256
# feature-unification break that only manifests on Linux (#361). This job
# exists to give that bug — and any future Linux-only feature-unification
# regression — a red/green signal so it can be fixed and stay fixed.
#
# It ALSO compile-checks every test target in the workspace (see the
# `cargo test --workspace --no-run` step). `cargo build --workspace` does NOT
# compile `[[test]]` / integration targets, so before this an integration test
# under `botho/tests/` could silently stop compiling and CI stayed green — that
# is exactly what happened to `network_integration` when the
# `create_sync_behaviour` signature changed in #551 (fixed in #563). The
# compile-check below makes that class of signature drift fail CI (#562).
#
# Trigger note: `**.rs` is included so a pure source change (no Cargo.toml/lock
# edit, like #551) still exercises the compile-check. Without it this workflow
# would not even run for the change that originally rotted the target.

on:
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'crypto/**'
      - 'web/packages/desktop/**'
      - '.github/workflows/workspace-build.yml'
      - 'scripts/research/ct-economics/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace-build:
    name: cargo build --workspace (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-03

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: workspace-build-linux

      # The Tauri desktop crate pulls glib-sys/gtk-sys via pkg-config; without
      # these dev packages the build fails before reaching the Rust compile
      # step that surfaces the k256 issue we're actually trying to gate on.
      # Package set matches Tauri v2 Linux prerequisites for ubuntu-latest
      # (webkit2gtk 4.1).
      - name: Install GTK/glib system deps (Tauri desktop crate)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      # Keep this a separate package-only invocation: workspace feature unification
      # can hide missing direct features used by the thin wallet (#1368).
      - name: Check standalone wallet without default features
        timeout-minutes: 15
        run: |
          cargo check --locked -p botho-wallet --lib --no-default-features
          cargo test --locked -p botho-wallet --lib --no-default-features --no-run

      - name: Run standalone wallet storage and recipient detection
        timeout-minutes: 5
        run: |
          cargo test --locked -p botho-wallet --lib --no-default-features storage::tests::
          cargo test --locked -p botho-wallet --lib --no-default-features transaction::tests::test_output_is_detectable_by_recipient -- --exact

      # Compile the ordinary desktop feature set in its own invocation; another
      # workspace package must not supply the PQ features its wallet requires.
      - name: Check standalone desktop hybrid wallet
        timeout-minutes: 15
        run: cargo check --locked -p botho-desktop --lib --tests

      - name: Build workspace
        run: cargo build --workspace

      # Compile (but do NOT run) every test target in the workspace, including
      # the integration tests under `botho/tests/` (network_integration,
      # byzantine_integration, etc.). `cargo build --workspace` above skips
      # `[[test]]` targets, so this is what actually catches integration-test
      # signature drift. Most integration/e2e suites are only compiled here:
      # slow/network-sensitive coverage needs a separate execution budget. The
      # compact-block suite runs below; docs/testing.md inventories the rest
      # and links the follow-ups for their missing execution coverage.
      - name: Compile-check all test targets (no run)
        run: cargo test --workspace --no-run

      # Inactive CT1 economics evidence uses the actual node/CLI selectors.
      # Compile once above, execute with a separate bounded budget; retain every
      # failed selection/fee affordability denominator and upload raw evidence.
      - name: Compile scoped CT1 economics and ledger test binaries
        timeout-minutes: 15
        run: cargo test --locked -p botho --lib --test ct_economics_simulation --test ct_economics_marginal --test ct_economics_workload --no-run

      - name: Run inactive CT1 economics and ledger adapter checks
        timeout-minutes: 3
        run: |
          CT_ECONOMICS_WRITE_REPORT=1 cargo test --locked -p botho --test ct_economics_simulation -- --nocapture
          cargo test --locked -p botho --lib ct1_research_ledger_decoy_adapter_parity
          CT_ECONOMICS_WRITE_REPORT=1 cargo test --locked -p botho --test ct_economics_marginal -- --nocapture
          python3 scripts/research/ct-economics/summarize.py
          python3 scripts/research/ct-economics/marginal_summary.py

      - name: Run bounded funded-payment and public-ticket workload
        timeout-minutes: 3
        run: |
          CT_ECONOMICS_WRITE_REPORT=1 cargo test --locked -p botho --test ct_economics_workload -- --nocapture
          python3 -m unittest discover -s scripts/research/ct-economics -p 'test_workload_owner_accounts.py'
          python3 scripts/research/ct-economics/workload_summary.py

      - name: Upload CT1 economics evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ct1-economics-${{ github.sha }}
          path: |
            scripts/research/ct-economics/results.json
            scripts/research/ct-economics/summary.json
            scripts/research/ct-economics/path-c.json
            scripts/research/ct-economics/web-selection.json
            scripts/research/ct-economics/marginal.json
            scripts/research/ct-economics/marginal-summary.json
            scripts/research/ct-economics/workload-results.json
            scripts/research/ct-economics/workload-summary.json
          if-no-files-found: warn

      # The compact-block suite caught serialized-size drift (#1187/#1212), but
      # --no-run never exercised its assertions. It needs no external services
      # and runs in seconds after compilation; keep it in the PR execution gate.
      - name: Run compact-block integration tests
        timeout-minutes: 10
        run: cargo test --locked -p botho --test compact_block_integration

      # These protocol/privacy suites use in-process simulations and duplex
      # streams, not public relays or STUN servers. Compile-only coverage missed
      # their assertions (#1272); reuse this job's build for actual execution.
      - name: Run protocol and privacy integration tests
        timeout-minutes: 10
        run: |
          cargo test --locked -p botho \
            --test circuit_handshake_integration \
            --test relay_handler_integration \
            --test onion_broadcast_integration \
            --test ice_stun_integration \
            --test signaling_integration \
            --test transport_negotiation_integration \
            --test traffic_indistinguishability \
            --test privacy_integration

      # Exercise actual UDP/DTLS/SCTP delivery and teardown; loopback only,
      # with no public STUN/TURN servers or manager activation (#1237).
      - name: Run WebRTC wrapper and local lifecycle tests
        timeout-minutes: 5
        run: cargo test --locked -p botho --lib "network::transport::webrtc::"

      # Execute real temporary-ledger and loopback RPC assertions (#1273).
      # These tests require no public node, faucet, credentials or live funds.
      - name: Run ledger and RPC integration tests
        timeout-minutes: 15
        run: |
          cargo test --locked -p botho \
            --test chain_sync_catchup_integration \
            --test issue_998_fresh_genesis_liveness \
            --test ledger_consistency_integration \
            --test tx_lifecycle_integration \
            --test rpc_integration \
            --test hybrid_coinbase_rpc \
            --test e2e_faucet_workflow

      - name: Check thin-wallet output-index compatibility and signing
        timeout-minutes: 5
        run: |
          cargo test --locked -p botho-wallet --lib rpc_pool::tests::
          cargo test --locked -p botho-wallet --lib transaction::tests::

      - name: Compile ledger and inactive LotteryV2 validation tests
        id: ledger_tests
        timeout-minutes: 15
        run: |
          cargo test --locked -p botho --lib --no-run --message-format=json > "$RUNNER_TEMP/ledger-compile.jsonl"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          messages = [json.loads(line) for line in Path(os.environ["RUNNER_TEMP"], "ledger-compile.jsonl").read_text().splitlines()]
          binaries = {m["executable"] for m in messages if m.get("reason") == "compiler-artifact"
                      and m.get("target", {}).get("name") == "botho"
                      and "lib" in m.get("target", {}).get("kind", [])
                      and m.get("profile", {}).get("test") and m.get("executable")}
          assert len(binaries) == 1, f"expected exactly one botho lib test binary, got {binaries}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"executable={binaries.pop()}\n")
          PYTHON

      - name: Run all ledger and inactive LotteryV2 validation tests
        timeout-minutes: 12
        env:
          LEDGER_TEST_EXECUTABLE: ${{ steps.ledger_tests.outputs.executable }}
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            uname -a
            sha256sum botho/src/ledger/store.rs botho/src/ledger/store/validation.rs botho/src/ledger/store/writer.rs botho/src/ledger/experimental.rs botho/src/ledger/experimental/validated.rs botho/src/ledger/experimental/validated/tests.rs botho/tests/common/positive_transfer.rs
            timeout 600s "$LEDGER_TEST_EXECUTABLE" ledger:: --nocapture
          } 2>&1 | tee "$RUNNER_TEMP/ledger-validation.log"

      - name: Retain ledger validation evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ledger-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ledger-compile.jsonl
            ${{ runner.temp }}/ledger-validation.log
          retention-days: 14
          if-no-files-found: warn

      - name: Run read-only legacy lottery inventory tests
        timeout-minutes: 5
        run: cargo test --locked -p botho --example legacy_lottery_inventory

      - name: Compile inactive native-wallet profile with checked arithmetic
        id: native_wallet_tests
        timeout-minutes: 15
        env:
          CARGO_PROFILE_CI_DEBUG_ASSERTIONS: 'true'
          CARGO_PROFILE_CI_OVERFLOW_CHECKS: 'true'
        run: |
          cargo test --locked --profile ci -p botho --lib --no-run --message-format=json > "$RUNNER_TEMP/native-wallet-compile.jsonl"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          messages = [json.loads(line) for line in Path(os.environ["RUNNER_TEMP"], "native-wallet-compile.jsonl").read_text().splitlines()]
          artifacts = [m for m in messages if m.get("reason") == "compiler-artifact"
                       and m.get("target", {}).get("name") == "botho"
                       and "lib" in m.get("target", {}).get("kind", [])
                       and m.get("profile", {}).get("test") and m.get("executable")]
          assert len(artifacts) == 1, f"expected one botho lib test artifact, got {len(artifacts)}"
          artifact = artifacts[0]
          profile = artifact["profile"]
          assert profile["opt_level"] == "2" and profile["debug_assertions"] is True and profile["overflow_checks"] is True, profile
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"executable={artifact['executable']}\n")
          PYTHON

      - name: Run inactive native-wallet discovery and accepted payout spends
        timeout-minutes: 32
        env:
          NATIVE_WALLET_TEST_EXECUTABLE: ${{ steps.native_wallet_tests.outputs.executable }}
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo --version
            uname -a
            sha256sum "$NATIVE_WALLET_TEST_EXECUTABLE" Cargo.toml Cargo.lock botho/src/wallet.rs botho/src/ledger/experimental.rs botho/src/ledger/experimental/validated.rs botho/src/ledger/experimental/validated/wallet.rs botho/src/ledger/experimental/validated/wallet/tests.rs botho/src/ledger/store/validation.rs botho/src/ledger/store/writer.rs botho/src/consensus/block_builder.rs transaction/clsag/src/lib.rs transaction/clsag/src/lottery_v2.rs cluster-tax/src/lottery.rs
            timeout 60s "$NATIVE_WALLET_TEST_EXECUTABLE" wallet::tests:: --nocapture || exit "$?"
            timeout 1800s "$NATIVE_WALLET_TEST_EXECUTABLE" ledger::experimental::validated::wallet::tests::native_wallet_accepted_repeated_nested_payout_spends --exact --ignored --nocapture || exit "$?"
          } 2>&1 | tee "$RUNNER_TEMP/native-wallet-validation.log"

      - name: Retain native-wallet validation evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-wallet-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-wallet-compile.jsonl
            ${{ runner.temp }}/native-wallet-validation.log
          retention-days: 14
          if-no-files-found: error

      # Doctests are NOT compiled by `--no-run` above and no other workflow
      # runs them, so documentation examples rotted silently (#670). They are
      # fast (seconds) and deterministic, so run them for real.
      - name: Run doctests
        run: cargo test --workspace --doc

      # Execute the Ethereum derivation fixtures and k256 golden signatures;
      # compile-only checks cannot detect changed cryptographic output (#1218).
      - name: Run bth-crypto-secp256k1 unit and golden tests
        run: cargo test -p bth-crypto-secp256k1
      # Actual R1CS prove/verify is prohibitively slow in an unoptimized build.
      # Compile separately so the five-minute execution bound remains meaningful.
      - name: Compile inactive CT integer and proof experiments
        timeout-minutes: 15
        run: cargo test --locked --release -p bth-ct-demurrage-reference --no-run

      - name: Check inactive CT demurrage integer constraints
        timeout-minutes: 5
        run: cargo test --locked --release -p bth-ct-demurrage-reference

      # The `cluster-tax`-gated code in `bth-transaction-core` only compiles —
      # and its tests only run — under `--all-features`. The default workspace
      # build/test above never exercises that path, so both a COMPILE break
      # (#1057) and two latent RUNTIME fee-gaming test failures (#1068) sat
      # green for a long time. `cargo check --all-features` alone was not
      # enough to catch #1068 (the module compiled but its tests failed), so we
      # RUN every all-features test here. Unoptimized cryptographic arithmetic
      # took over 15 minutes in run 35499453189. Optimize without disabling
      # debug assertions or overflow checks (including the dalek exemption in
      # the production release profile). These overrides apply only to this gate.
      - name: Compile bth-transaction-core --all-features tests
        timeout-minutes: 15
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: >-
          cargo test --locked --release -p bth-transaction-core --all-features
          --config 'profile.release.package.curve25519-dalek.overflow-checks=true'
          --no-run

      - name: Run bth-transaction-core --all-features tests (cluster-tax path)
        timeout-minutes: 5
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: >-
          cargo test --locked --release -p bth-transaction-core --all-features
          --config 'profile.release.package.curve25519-dalek.overflow-checks=true'
