name: Inactive resource frontier
on:
  pull_request:
    paths:
      - 'scripts/research/resource-frontier/**'
      - '.github/workflows/resource-frontier.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/research/resource-frontier/**'
      - '.github/workflows/resource-frontier.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact arithmetic, sensitivity and recorded artifacts
        run: python3 -m unittest discover -s scripts/research/resource-frontier -v
