name: Aeneas extraction drift

# Two jobs over formal-aeneas/ (#1712, #1821, epic #1704):
#
# drift: re-runs the Charon + Aeneas Rust -> Lean extraction of the
#   cluster-tax and botho kernels checked in under formal-aeneas/generated/ and fails if
#   the fresh output differs from what is committed. A Rust edit to a mirrored
#   kernel therefore cannot silently invalidate Lean proofs written against
#   the extraction: the PR must regenerate (formal-aeneas/regen.sh) and the
#   diff of the generated Lean is reviewed alongside the Rust change.
# typecheck: builds the formal-aeneas lake package (the generated Lean plus
#   the proofs about it) against the pinned Aeneas Lean library and Mathlib,
#   and runs its sorry / axiom gates and their self-test.
#
# Deliberately separate from formal.yml: own jobs, own toolchains (the pinned
# Aeneas release, the Rust nightly its charon-driver links against, and an
# elan install in this job), cache keys that formal.yml never reads, and they
# neither build nor feed the formal/ lake package or its build -> verify trust
# chain. formal.yml is unchanged.
#
# Not a required check, so a workflow-level paths filter is fine.

on:
  pull_request:
    paths:
      - "cluster-tax/**"
      - "botho/src/consensus/lottery.rs"
      - "formal-aeneas/**"
      - "formal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/aeneas-extract.yml"
  push:
    branches: [main]
    paths:
      - "cluster-tax/**"
      - "botho/src/consensus/lottery.rs"
      - "formal-aeneas/**"
      - "formal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/aeneas-extract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeneas-extract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned toolchain
        run: |
          set -a; . formal-aeneas/toolchain.env; set +a
          echo "CHARON_RUST_NIGHTLY=$CHARON_RUST_NIGHTLY" >>"$GITHUB_ENV"
          echo "CHARON_RUST_COMPONENTS=$CHARON_RUST_COMPONENTS" >>"$GITHUB_ENV"
      # Adds the nightly next to the runner's default toolchain; the
      # workspace rust-toolchain file is not used by charon.
      - name: Install charon's Rust nightly
        run: |
          rustup toolchain install "$CHARON_RUST_NIGHTLY" --profile minimal \
            -c "$CHARON_RUST_COMPONENTS"
      # The release tarball is sha256-checked by regen.sh on download.
      - name: Cache Aeneas release
        uses: actions/cache@v6
        with:
          path: ~/.cache/botho-aeneas
          key: aeneas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal-aeneas/toolchain.env') }}
      - name: Check generated Lean is up to date
        env:
          CHARON_TARGET_DIR: ${{ runner.temp }}/charon-target
        run: formal-aeneas/regen.sh --check

  # Type-check the extraction and check the proofs (#1821).
  #
  # Runs on the runner host, not in a container. The Mathlib dependency
  # unpacks to about 7.2 GB, and when the runner is short of space the disk
  # step deletes the runner's preinstalled toolchains to make room; in a container
  # job every step runs inside the container and cannot reach the host disk.
  # Isolation is the same as for `drift`: its own job with a read-only token,
  # no secrets, no artifacts consumed elsewhere, an elan toolchain installed
  # into this job's $HOME from a sha256-pinned installer, and caches keyed
  # only for this job.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELAN_VERSION: v4.2.4
      # sha256 of elan-init.sh at ELAN_VERSION (the same pin as formal.yml).
      ELAN_INIT_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
    defaults:
      run:
        working-directory: formal-aeneas
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Mathlib unpacked (~7.2 GB) + its .ltar cache (~0.5 GB) + git checkouts
      # of the dependencies + the self-test copies need about 15 GB. Free up
      # space only when the runner has less than that: deleting the
      # preinstalled SDKs takes about 2 minutes.
      - name: Check disk space (free up if needed)
        working-directory: .
        run: |
          need_gb=15
          avail() { echo $(( $(df --output=avail -k "$GITHUB_WORKSPACE" | tail -1) / 1024 / 1024 )); }
          echo "available: $(avail) GB, needed: ${need_gb} GB"
          if (( $(avail) < need_gb )); then
            # Preinstalled SDKs this job never uses.
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
            echo "after free-up: $(avail) GB"
          fi
          if (( $(avail) < need_gb )); then
            echo "::error::only $(avail) GB free, need ${need_gb} GB for Mathlib"
            exit 1
          fi
      - name: Install elan
        run: |
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_VERSION}/elan-init.sh" \
            -o "$RUNNER_TEMP/elan-init.sh"
          echo "${ELAN_INIT_SHA256}  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >>"$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        run: |
          tc="$(tr -d '[:space:]' <lean-toolchain)"
          if [[ ! "$tc" =~ ^leanprover/lean4:v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::lean-toolchain must name an official Lean release, got $tc"
            exit 1
          fi
          elan toolchain install "$tc"
          lean --version
      # Compressed Mathlib oleans (the .ltar files `lake exe cache get`
      # downloads), keyed on the pinned toolchain and dependency revisions.
      # On a hit, `cache get` only unpacks them. The unpacked tree is not
      # cached: at ~7 GB it would cost more to save and restore than to
      # unpack.
      - name: Cache Mathlib oleans
        uses: actions/cache@v6
        with:
          path: ~/.cache/mathlib
          key: aeneas-mathlib-${{ runner.os }}-${{ hashFiles('formal-aeneas/toolchain.env', 'formal-aeneas/lean-toolchain', 'formal-aeneas/lake-manifest.json') }}
      - name: Fetch dependencies and Mathlib oleans
        run: |
          time lake exe cache get
          # The Aeneas library must use the same Lean as this package.
          aeneas_tc="$(tr -d '[:space:]' <.lake/packages/aeneas/backends/lean/lean-toolchain)"
          if [[ "$aeneas_tc" != "$(tr -d '[:space:]' <lean-toolchain)" ]]; then
            echo "::error::Aeneas library wants $aeneas_tc, lean-toolchain pins $(cat lean-toolchain)"
            exit 1
          fi
          df -h "$GITHUB_WORKSPACE"
      - name: Install pinned Charon tools for disposable proof-chain controls
        run: |
          set -euo pipefail
          set -a; . toolchain.env; set +a
          rustup toolchain install "$CHARON_RUST_NIGHTLY" --profile minimal -c "$CHARON_RUST_COMPONENTS"
      - name: Cache pinned extraction release for controls
        uses: actions/cache@v6
        with:
          path: ~/.cache/botho-aeneas
          key: aeneas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal-aeneas/toolchain.env') }}
      - name: Build, sorry gate and axiom gate
        run: |
          set -euo pipefail
          mkdir -p .lake/gate-evidence
          { git rev-parse HEAD 'HEAD^{tree}'; git status --porcelain; } >.lake/gate-evidence/checkout.txt
          sha256sum ../formal/Botho/Lottery/{Pool,Draw,Prims,Candidate,Arith}.lean \
            ../formal/lean-toolchain ../botho/src/consensus/lottery.rs \
            BothoAeneas/*.lean generated/*.lean Theorems.lean lakefile.toml \
            scripts/* >.lake/gate-evidence/sources.sha256
          time scripts/check-gates.sh 2>&1 | tee .lake/gate-evidence/check-gates.log
          test ! -e ../formal/.lake
          find .lake/build/lib/lean/Botho/Lottery -type f -print0 | sort -z | \
            xargs -0 sha256sum >.lake/gate-evidence/canonical-artifacts.sha256
          echo 'canonical source: ../formal; artifacts: formal-aeneas/.lake/build; formal/.lake absent' \
            | tee .lake/gate-evidence/artifact-boundary.txt
      - name: Gate self-test
        env:
          SELFTEST_EVIDENCE_DIR: ${{ github.workspace }}/formal-aeneas/.lake/gate-evidence/selftest
        run: |
          set -euo pipefail
          time scripts/selftest-gates.sh 2>&1 | tee .lake/gate-evidence/selftest.log
      - name: Disposable Rust regeneration and proof-chain controls
        working-directory: .
        env:
          CHARON_TARGET_DIR: ${{ runner.temp }}/charon-control-target
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/issue-1713-control.py" <<'PYCONTROL'
          """Run only on an authorized disposable CI checkout with pinned tools installed."""
          from pathlib import Path
          import subprocess, hashlib, json, os, time, re, difflib, signal
          root=Path.cwd().resolve(); assert (root/'formal-aeneas').is_dir()
          evidence=root/'formal-aeneas/.lake/rust-control'; evidence.mkdir(parents=True,exist_ok=True)
          paths=['botho/src/consensus/lottery.rs','formal-aeneas/generated/PoolAccounting.lean','formal-aeneas/generated/MonetaryKernels.lean']
          original={p:(root/p).read_bytes() for p in paths}
          sha=lambda b:hashlib.sha256(b).hexdigest()
          record={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'original':{p:sha(b) for p,b in original.items()},'commands':[]}
          record['source_hashes']={str(p.relative_to(root)):sha(p.read_bytes()) for p in [
              *(root/'formal/Botho/Lottery').glob('*.lean'),
              *(root/'formal-aeneas/BothoAeneas').glob('*.lean'),
              *(root/'formal-aeneas/scripts').glob('*'),
              root/'formal-aeneas/toolchain.env',root/'formal-aeneas/lean-toolchain',
              root/'formal-aeneas/lakefile.toml',root/'.github/workflows/aeneas-extract.yml'] if p.is_file()}
          lean=Path(subprocess.check_output(['elan','which','lean'],cwd=root/'formal-aeneas',text=True).strip())
          record['lean_binary']={'path':str(lean),'sha256':sha(lean.read_bytes())}
          def save(): (evidence/'receipt.json').write_text(json.dumps(record,indent=2)+'\n')
          def run(name,args,want=0,pattern=None,cap=600):
           start=time.time(); logfile=evidence/(name+'.log')
           with logfile.open('w') as f:
            p=subprocess.Popen(args,cwd=root,stdout=f,stderr=subprocess.STDOUT,start_new_session=True)
            try: code=p.wait(timeout=cap)
            except subprocess.TimeoutExpired:
             os.killpg(p.pid,signal.SIGTERM)
             try: p.wait(timeout=10)
             except subprocess.TimeoutExpired: os.killpg(p.pid,signal.SIGKILL);p.wait()
             code=124
           text=logfile.read_text(); record['commands'].append({'name':name,'argv':args,'cwd':str(root),'cap_seconds':cap,'elapsed_seconds':time.time()-start,'exit':code,'expected_exit':want,'log_sha256':sha(logfile.read_bytes()),'inputs':{p:sha((root/p).read_bytes()) for p in paths}});save()
           if code != want or (pattern and pattern not in text): raise RuntimeError(f'{name}: exit {code}, expected {want}; diagnostic {pattern!r}')
           print(name,'exit',code,flush=True); return text
          rust=root/paths[0]
          try:
           s=rust.read_text(); start=s.index('pub fn compute_pool_accounting_permille(');end=s.index('\n}',start)+2
           old=s[start:end]; assert old.count('        payout,')==1
           new=old.replace('        payout,','        payout: 0,')
           mutant=s[:start]+new+s[end:];rust.write_text(mutant)
           (evidence/'rust-payout.patch').write_text(''.join(difflib.unified_diff(s.splitlines(True),mutant.splitlines(True),fromfile=paths[0],tofile=paths[0])))
           record['mutant_rust_sha256']=sha(rust.read_bytes());save()
           run('regeneration-drift',['formal-aeneas/regen.sh','--check'],1,'formal-aeneas/generated/ is out of date')
           assert all((root/p).read_bytes()==original[p] for p in paths[1:])
           run('authentic-regeneration',['formal-aeneas/regen.sh'])
           for p in paths[1:]: (evidence/Path(p).name).write_bytes((root/p).read_bytes())
           assert (root/paths[1]).read_bytes()!=original[paths[1]]
           run('regenerated-source-scan',['python3','-I','formal-aeneas/scripts/gate_scan.py','formal-aeneas'])
           log=run('semantic-proof-rejection',['formal-aeneas/scripts/check-gates.sh'],1,'FAIL: lake build failed')
           m=re.search(r'error: (?:[^\n]*?/)?BothoAeneas/PoolAccounting.lean:(\d+):',log)
           assert m,'missing pool proof diagnostic'
           source=(root/'formal-aeneas/BothoAeneas/PoolAccounting.lean').read_text().splitlines()
           names=[re.match(r'theorem (\w+)',line).group(1) for line in source[:int(m.group(1))] if re.match(r'theorem (\w+)',line)]
           record['first_rejecting_declaration']=names[-1];record['first_rejecting_line']=int(m.group(1));save()
           assert names[-1] in {'compute_pool_accounting_permille_spec','compute_pool_accounting_permille_model'},names[-1]
          finally:
           for p,b in original.items(): (root/p).write_bytes(b)
           record['restored']={p:sha((root/p).read_bytes()) for p in paths};save()
          run('restored-regeneration',['formal-aeneas/regen.sh','--check'])
          run('restored-gates',['formal-aeneas/scripts/check-gates.sh'])
          try:
           s=rust.read_text();start=s.index('pub fn compute_pool_accounting(');end=s.index('\n}',start)+2
           old=s[start:end];new=old.replace('        total_fees,\n        emission_share,','        emission_share,\n        total_fees,');assert old!=new
           mutant=s[:start]+new+s[end:];rust.write_text(mutant)
           (evidence/'wrapper.patch').write_text(''.join(difflib.unified_diff(s.splitlines(True),mutant.splitlines(True),fromfile=paths[0],tofile=paths[0])))
           assert all((root/p).read_bytes()==original[p] for p in paths[1:])
           run('wrapper-extraction-unchanged',['formal-aeneas/regen.sh','--check'])
           run('wrapper-rejection',['python3','-I','formal-aeneas/scripts/gate_scan.py','formal-aeneas'],1,'wrapper source contract:')
          finally:
           for p,b in original.items(): (root/p).write_bytes(b)
          run('final-restored-gates',['formal-aeneas/scripts/check-gates.sh'])
          run('clean-restored-tree',['git','diff','--exit-code'])
          record['all_commands_settled']=True; record['restored']={p:sha((root/p).read_bytes()) for p in paths};save()
          print('first rejecting declaration:',record['first_rejecting_declaration'],flush=True)
          PYCONTROL
          python3 -u "$RUNNER_TEMP/issue-1713-control.py"
      - name: Retain gate and negative-control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aeneas-gate-evidence
          path: |
            formal-aeneas/.lake/gate-evidence/
            formal-aeneas/.lake/rust-control/
          retention-days: 14
