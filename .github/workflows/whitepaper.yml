name: Build Whitepaper PDF

on:
  push:
    branches: [main]
    paths:
      - 'whitepaper/**'
      - 'web/packages/web-wallet/public/botho-whitepaper.pdf'
  pull_request:
    branches: [main]
    paths:
      - 'whitepaper/**'
      - 'web/packages/web-wallet/public/botho-whitepaper.pdf'
  workflow_dispatch:

jobs:
  web-copy-sync:
    # The landing page serves web/packages/web-wallet/public/botho-whitepaper.pdf.
    # It is a manual copy of whitepaper/botho-whitepaper.pdf and has drifted
    # before (2 months stale on the live site, found 2026-08-17). Fail loudly
    # whenever the two diverge.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check web copy matches whitepaper/
        run: |
          if ! cmp -s whitepaper/botho-whitepaper.pdf \
                      web/packages/web-wallet/public/botho-whitepaper.pdf; then
            echo "::error::web/packages/web-wallet/public/botho-whitepaper.pdf is out of sync with whitepaper/botho-whitepaper.pdf."
            echo "Fix: cp whitepaper/botho-whitepaper.pdf web/packages/web-wallet/public/botho-whitepaper.pdf"
            exit 1
          fi
          echo "Web copy is in sync."

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science texlive-bibtex-extra biber

      - name: Build PDF
        working-directory: whitepaper
        run: |
          # Build with multiple passes for references
          pdflatex -interaction=nonstopmode botho-whitepaper.tex || true
          bibtex botho-whitepaper || true
          pdflatex -interaction=nonstopmode botho-whitepaper.tex || true
          pdflatex -interaction=nonstopmode botho-whitepaper.tex

      - name: Check PDF was created
        working-directory: whitepaper
        run: |
          if [ ! -f "botho-whitepaper.pdf" ]; then
            echo "ERROR: PDF was not generated"
            exit 1
          fi
          echo "PDF generated successfully"
          ls -la botho-whitepaper.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: botho-whitepaper
          path: whitepaper/botho-whitepaper.pdf
          retention-days: 30

      - name: Upload PDF to release (on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: botho-whitepaper-latest
          path: whitepaper/botho-whitepaper.pdf
          retention-days: 90
