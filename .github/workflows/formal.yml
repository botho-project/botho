name: Formal (Lean)

# Builds the Lean 4 model under formal/ and checks it (#1705, epic #1704).
#
# Two jobs, split at a trust boundary (#1799):
#
#   build   UNTRUSTED. Checks out the pull request and runs `lake build` and
#           the in-tree gates. Building runs code from the model (an
#           `initialize`, a simproc, `decide +native`, ...), so nothing this
#           job reports or leaves on disk is trusted. It uploads only the
#           compiled .olean files, as the artifact `formal-lib`.
#   verify  TRUSTED. A fresh runner with no cache. It checks out
#           formal/scripts/ (verify-artifacts.sh, AxiomReport.lean, the
#           scan), axioms-allowlist.txt and lakefile.toml from the BASE
#           commit, never from the pull request, downloads `formal-lib`,
#           and runs leanchecker and the independent axiom walk over it. It never runs `lake` and
#           never compiles or imports model code through the Lean frontend,
#           so model code does not run in this job (see "Limits" in
#           formal/README.md). The pull request's sources are read as data:
#           the base branch's scan checks them, the manifest is parsed as
#           text, and their lakefile.toml must compile the same sources as
#           the base's (same srcDir, libraries, roots and globs).
#
# The workflow file itself comes from the pull request (that is how
# `pull_request` works; `pull_request_target` would be worse: it runs with a
# write token and secrets). Changes to this file and to formal/scripts/ need
# human review; .github/CODEOWNERS names the reviewer (#1804).
#
# No workflow-level `paths:` filter on purpose: a path-filtered workflow that
# is skipped leaves a required check pending forever. The `changes` job decides
# whether `build` and `verify` run, and `formal-gate` always runs and passes
# when both succeeded or both were skipped. Make `formal-gate` the required
# check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELAN_VERSION: v4.2.4
  # sha256 of elan-init.sh at ELAN_VERSION. The verify job checks it.
  ELAN_INIT_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      formal: ${{ steps.filter.outputs.formal }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect formal-relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Paths that trigger the Lean job. Child issues of #1704 append the
          # Rust files their models mirror.
          pattern='^(formal/|\.github/workflows/formal\.yml$|cluster-tax/src/lottery\.rs$|botho/src/block\.rs$)'
          case "$EVENT" in
            pull_request) range="$BASE_SHA...HEAD" ;;
            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
                echo "formal=true" >>"$GITHUB_OUTPUT"; exit 0
              fi
              range="$BEFORE_SHA..HEAD" ;;
            *) echo "formal=true" >>"$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! changed="$(git diff --name-only "$range")"; then
            echo "diff failed for $range; running the Lean job to be safe"
            echo "formal=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed files:"; echo "$changed"
          if grep -Eq "$pattern" <<<"$changed"; then
            echo "formal=true" >>"$GITHUB_OUTPUT"
          else
            echo "formal=false" >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Untrusted: read-only token, no secrets.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Needs no Lean: runs the verify step's script against stub verifiers
      # and checks that a base commit without a verifier fails (#1804).
      - name: Workflow self-test (verify fails closed)
        run: scripts/selftest-workflow.sh
      # Only the toolchain is cached, and only this job restores it. There is
      # no .lake cache: a cached build from one run must never feed another
      # (#1799).
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ env.ELAN_VERSION }}-${{ hashFiles('formal/lean-toolchain') }}
      - name: Install elan
        run: |
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_VERSION}/elan-init.sh" -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none --no-modify-path
            rm elan-init.sh
          fi
          echo "$HOME/.elan/bin" >>"$GITHUB_PATH"
      - name: Install pinned toolchain
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
      # Fast feedback only: the gates build the model themselves. The
      # verdict comes from the verify job.
      - name: Sorry gate
        run: scripts/check-sorry.sh
      - name: Axiom gate
        run: scripts/check-axioms.sh
      # Keep this file list in sync with artifact_files in
      # formal/scripts/selftest-verify.sh.
      - name: Stage compiled library
        run: |
          stage="$RUNNER_TEMP/formal-lib"
          mkdir -p "$stage"
          cd .lake/build/lib/lean
          find . -type f \( -name '*.olean' -o -name '*.olean.server' \
            -o -name '*.olean.private' -o -name '*.ir' \) -print0 \
            | xargs -0 -I{} cp --parents {} "$stage/"
          find "$stage" -type f | sort
      - name: Upload compiled library
        uses: actions/upload-artifact@v7
        with:
          name: formal-lib
          path: ${{ runner.temp }}/formal-lib
          if-no-files-found: error
          retention-days: 5
      # The self-tests run fixture code, so they run after the upload.
      - name: Gate self-test
        run: scripts/selftest-gates.sh
      - name: Verify self-test (#1783 review PoCs)
        run: scripts/selftest-verify.sh

  verify:
    needs: [changes, build]
    if: needs.changes.outputs.formal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The commit whose gate scripts and allow-list decide the verdict: the
      # base of a pull request, otherwise the pushed (already merged) commit.
      TRUSTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Check out gate scripts, allow-list and lakefile (base commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TRUSTED_SHA }}
          path: trusted
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /formal/scripts/
            /formal/axioms-allowlist.txt
            /formal/lakefile.toml
            /formal/lakefile.lean
      - name: Check out pull request sources (data only, never built)
        uses: actions/checkout@v7
        with:
          path: untrusted
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /formal/
      - name: Download compiled library
        uses: actions/download-artifact@v8
        with:
          name: formal-lib
          path: ${{ runner.temp }}/formal-lib
      # Fresh install, no cache: a cache written by the untrusted build job
      # could hold a modified toolchain.
      - name: Install elan and the toolchain
        id: toolchain
        run: |
          tc="$(tr -d '[:space:]' <untrusted/formal/lean-toolchain)"
          # Only official Lean releases: the pull request picks the version,
          # never the origin of the binaries this job runs.
          if [[ ! "$tc" =~ ^leanprover/lean4:v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::lean-toolchain '$tc' is not an official leanprover/lean4 release"
            exit 1
          fi
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_VERSION}/elan-init.sh" -o "$RUNNER_TEMP/elan-init.sh"
          echo "${ELAN_INIT_SHA256}  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "$tc"
          sysroot="$HOME/.elan/toolchains/$(sed -e 's|/|--|g' -e 's|:|---|g' <<<"$tc")"
          "$sysroot/bin/lean" --version
          echo "sysroot=$sysroot" >>"$GITHUB_OUTPUT"
      # No lean, lake or elan is on PATH here: verify-artifacts.sh takes the
      # toolchain from --sysroot alone (LEAN_SYSROOT for every Lean process).
      - name: Verify (base-commit gates over the compiled library)
        env:
          SYSROOT: ${{ steps.toolchain.outputs.sysroot }}
        # Fails closed: if the base commit has no verifier, nothing else runs
        # (#1804). Never fall back to the pull request's copy. Keep this block
        # free of ${{ }} expressions: scripts/selftest-workflow.sh runs it.
        run: |
          verifier=trusted/formal/scripts/verify-artifacts.sh
          if [[ ! -f "$verifier" ]]; then
            echo "::error::base commit has no formal/scripts/verify-artifacts.sh; refusing to verify"
            exit 1
          fi
          bash "$verifier" \
            --lib "$RUNNER_TEMP/formal-lib" \
            --sources untrusted/formal \
            --sysroot "$SYSROOT" \
            --allowlist trusted/formal/axioms-allowlist.txt \
            --base-lakefile trusted/formal/lakefile.toml

  formal-gate:
    needs: [changes, build, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require build and verify success, or both skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          echo "changes=$CHANGES build=$BUILD verify=$VERIFY"
          if [[ "$CHANGES" != "success" ]]; then
            echo "changes job did not succeed" >&2; exit 1
          fi
          if [[ "$BUILD" == "skipped" && "$VERIFY" == "skipped" ]]; then
            exit 0
          fi
          if [[ "$BUILD" != "success" || "$VERIFY" != "success" ]]; then
            echo "build and verify must both succeed" >&2; exit 1
          fi
