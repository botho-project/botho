name: CT candidate contract vectors
on:
  pull_request:
    paths:
      - 'scripts/research/ct_contract_vectors.py'
      - 'scripts/research/fixtures/ct-*.json'
      - 'docs/design/ct-transaction-contract.md'
      - 'docs/decisions/0009-confidential-amounts-economics.md'
      - 'cluster-tax/src/**'
      - 'botho/src/ledger/store.rs'
      - 'crypto/ring-signature/src/amount/commitment.rs'
      - 'crypto/ring-signature/src/ring_signature/mod.rs'
      - 'transaction/types/src/constants.rs'
      - 'transaction/clsag/src/lib.rs'
      - '.github/workflows/ct-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check inactive integer vectors and pinned source inventory
        run: python3 scripts/research/ct_contract_vectors.py
