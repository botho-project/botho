# Dependabot version updates (/repo:deps). Grouping policy: Actions fully
# grouped (majors included — individually reviewing them is noise); package
# ecosystems group minor+patch and leave majors ungrouped so each breaking
# change gets its own reviewable PR. playwright* stays out of the web group
# because it is coupled to a browser binary. Installer-owned manifests
# (.anvil/pyproject.toml) are deliberately absent — /repo:update-tools owns
# them. Security-fix PRs are governed by the repo-level flag, not this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # Its tag IS the Rust toolchain version to install
      # (solana-contracts-ci pins 1.79.0 for the anchor/Solana build), so a
      # "bump" changes which Rust gets installed — 1.100.0 doesn't exist and
      # 404s the job. Toolchain pins are upgraded deliberately, not chased.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # Lockstep families that cannot move one crate at a time. Individual
      # bumps are guaranteed-red (two trait-incompatible majors in-tree) and
      # each family upgrade is a deliberate migration through
      # consensus-critical code, tracked as an issue:
      # dalek-5 family (#1153): CLSAG / key code
      - dependency-name: "ed25519"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ed25519-dalek"
        update-types: ["version-update:semver-major"]
      - dependency-name: "curve25519-dalek"
        update-types: ["version-update:semver-major"]
      - dependency-name: "signature"
        update-types: ["version-update:semver-major"]
      - dependency-name: "x25519-dalek"
        update-types: ["version-update:semver-major"]
      # rand family (#1154): deterministic key derivation. Pre-1.0, so 0.x
      # "minors" are the breaking axis — ignore those too; patches flow.
      - dependency-name: "rand"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_chacha"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_hc"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_distr"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "getrandom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      web-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["playwright*", "@playwright/*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/contracts/ethereum"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      eth-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/contracts/solana"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # Pre-1.0 Solana SDKs: 0.x "minors" are breaking-class (anchor 0.30
      # changed the IDL format) and the TS client must match the anchor-0.29 /
      # Solana-1.18 toolchain the on-chain program is built with. Upgrading is
      # a deliberate toolchain migration, not a dependency bump ('_bn' errors
      # in anchor test = this mismatch). Patches still flow.
      - dependency-name: "@coral-xyz/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@orca-so/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      sol-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/mobile/app"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # Expo packages are SDK-versioned lockstep (#1173): every expo-* /
      # react-native-* major belongs to "upgrade the Expo SDK", done via
      # `npx expo install --fix`, not per-package bumps — and mobile/ has no
      # CI, so a green check here verifies nothing. Patches still flow.
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      mobile-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/consensus/scp/viewer"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      viewer-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
