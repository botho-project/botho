# Dependabot version updates (/repo:deps). Grouping policy: Actions fully
# grouped (majors included — individually reviewing them is noise); package
# ecosystems group minor+patch and leave majors ungrouped so each breaking
# change gets its own reviewable PR. playwright* stays out of the web group
# because it is coupled to a browser binary. Installer-owned manifests
# (.anvil/pyproject.toml) are deliberately absent — /repo:update-tools owns
# them. Security-fix PRs are governed by the repo-level flag, not this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # Its tag IS the Rust toolchain version to install
      # (solana-contracts-ci pins 1.79.0 for the anchor/Solana build), so a
      # "bump" changes which Rust gets installed — 1.100.0 doesn't exist and
      # 404s the job. Toolchain pins are upgraded deliberately, not chased.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # Lockstep families that cannot move one crate at a time. Individual
      # bumps are guaranteed-red (two trait-incompatible majors in-tree) and
      # each family upgrade is a deliberate migration through
      # consensus-critical code, tracked as an issue:
      # The dalek-5 family migrated in #1153, but the workspace keeps a
      # deliberate curve25519-dalek 4 pin (`curve25519-dalek-v4`) for the
      # bulletproofs-og interop boundary in transaction/core/src/range_proofs.
      # A major bump of that pin is guaranteed-red until a bulletproofs
      # release supports curve25519-dalek 5; remove this ignore when the
      # v4 pin is retired.
      - dependency-name: "curve25519-dalek"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      web-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["playwright*", "@playwright/*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/contracts/ethereum"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      eth-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/contracts/solana"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # Pre-1.0 Solana SDKs: 0.x "minors" are breaking-class (anchor 0.30
      # changed the IDL format) and the TS client must match the anchor-0.29 /
      # Solana-1.18 toolchain the on-chain program is built with. Upgrading is
      # a deliberate toolchain migration, not a dependency bump ('_bn' errors
      # in anchor test = this mismatch). Patches still flow.
      - dependency-name: "@coral-xyz/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@orca-so/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      sol-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/mobile/app"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # react majors move with the Expo SDK's paired React Native release
      # (React 19.2 <-> RN 0.86 <-> SDK 57), so a lone react major is
      # guaranteed-red; expo-* / react-native-* majors flow again now that
      # the app is on SDK 57 and mobile-ci.yml gates them (#1173) —
      # `npx expo install --fix` remains the supported way to take an SDK
      # upgrade when one of those majors goes red.
      #
      # The minor/patch ignores below exist for the same lockstep reason, one
      # level down. mobile-ci.yml's final step, `npx expo-doctor`, checks every
      # package against the *exact* version set the installed Expo SDK expects
      # (Expo's own compatibility table — NOT the semver ranges in
      # package.json). These three are pinned exactly or loosely-tilde'd in
      # mobile/app/package.json, so Dependabot is free to widen them past SDK
      # 57's expected set, and every such bump is guaranteed-red: PR #1191
      # (react 19.2.3->19.2.8, react-native-safe-area-context 5.7.0->5.8.1,
      # react-native-screens 4.26.2->4.27.0) passed typecheck + jest and still
      # failed expo-doctor on exactly these three (#1205). expo / expo-* need
      # no entry — they are tilde-pinned to ~57.0.x, which already confines
      # Dependabot to patch bumps inside the current SDK.
      #
      # REVISIT ON THE NEXT EXPO SDK BUMP: these versions are not frozen
      # forever, they are owned by `npx expo install --fix` as part of the SDK
      # migration. When mobile/app leaves SDK 57, re-run that, re-pin, and
      # re-check whether each ignore is still needed.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-safe-area-context"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-screens"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      mobile-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/consensus/scp/viewer"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      viewer-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
