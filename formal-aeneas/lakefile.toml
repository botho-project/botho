name = "botho_aeneas"
version = "0.1.0"
defaultTargets = ["MonetaryKernels", "PoolAccounting", "BothoAeneas"]

# The Aeneas Lean library at the commit of the pinned release
# (AENEAS_COMMIT in toolchain.env; scripts/gate_scan.py checks they are equal).
# It brings Mathlib in transitively; lake-manifest.json pins every revision.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "ab34bd28458a08c150b7cbf1873e59af74588138"
subDir = "backends/lean"

# The Aeneas extraction, exactly as regen.sh writes it: one library per
# extracted crate (bth-cluster-tax, botho).
[[lean_lib]]
name = "MonetaryKernels"
srcDir = "generated"

[[lean_lib]]
name = "PoolAccounting"
srcDir = "generated"

# Proofs about the extraction.
[[lean_lib]]
name = "BothoAeneas"

# Compile only this reviewed canonical source closure into this package's .lake.
# These are source paths, never formal/.lake artifacts or a package dependency.
[[lean_lib]]
name = "CanonicalLottery"
srcDir = "../formal"
roots = ["Botho.Lottery.Pool", "Botho.Lottery.Draw", "Botho.Lottery.Prims", "Botho.Lottery.Candidate", "Botho.Lottery.Arith"]
globs = ["Botho.Lottery.Pool", "Botho.Lottery.Draw", "Botho.Lottery.Prims", "Botho.Lottery.Candidate", "Botho.Lottery.Arith"]
